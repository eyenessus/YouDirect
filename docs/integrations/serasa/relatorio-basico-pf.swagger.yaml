openapi: 3.0.1
info:
  title: CS-Person-Information-Report-BR
  description: "This API return a report with informations about negative data (pefin,\
    \ refin, SPC), score of the consulted document, registration data (name, identity,\
    \ address) and if the consulted document has alert about stolen documents."
  contact:
    name: Experian API team - Credit Services
    email: implantacao@br.experian.com
  version: 1.0.0
servers:
  - url: https://sandbox-api.serasaexperian.com.br/credit-services/person-information-report/v1
paths:
  /creditreport:
    get:
      tags:
        - Credit Report
      summary: Get a credit report (External Request)
      description: Returns a report. To access this method the client (application)
        must have "CLI-AUTH-IDENTIFIED" authentication and "CLI-3RDPARTY" role and
        user must have 'AUTH-BASIC' level and 'USER' or 'BUSINESS' role.
      operationId: getReportExternalChannel
      parameters:
        - name: X-Document-Id
          in: header
          description: Consumer document identification to fetch
          schema:
            type: string
        - name: X-Retailer-Document-Id
          in: header
          description: Retailer company document code to identify the retailer company
            in the payment process
          schema:
            type: string
        - name: X-Cost-Center
          in: header
          description: Internal billing center informed by the customer
          schema:
            type: string
        - name: reportName
          in: query
          description: Consumer document identification to fetch
          schema:
            type: string
        - name: federalUnit
          in: query
          description: Federal unit used to filter notary reports
          schema:
            type: string
        - name: optionalFeatures
          in: query
          description: Optional Features for consult
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: reportParameters
          in: query
          description: String on format Base64 of object (ReportParameters) in json
            format
          schema:
            type: string
      responses:
        "200":
          description: Consumer Report Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonInformationReportResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "401":
          description: |-
            Authorization Failed
            | Code | Message
            | 10   | You don't have access to this product yet. Please contact support.
            | 401  | Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "403":
          description: |-
            Unauthorized user for transaction
            | Code | Message
            | 30   | Information not available for the document consulted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "404":
          description: |-
            Not found
            | Code | Message
            | 40   | The report <name of the report informed in the request> does not exist. Please check the name of the report.
            | 40   | The optional feature <name of the feature informed in the request> does not exist. Please check the name of the optional feature.
            | 41   | The service <call url> does not exist. Please check the service url provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "412":
          description: |-
            Missing Required Field
            | Code | Message
            | 50   | BusinessId was not identified. Please contact support.
            | 60   | The report <name of the reported report> is inactive. Please refer to an active report.
            | 70   | The document number entered is incorrect. Please check the document number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "429":
          description: |-
            Too many requests
            | Code | Message
            | 429  | Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "500":
          description: |-
            Internal Server Error
            | Code | Message
            | 20   | An internal error has occurred, if the problem persists, please contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      security:
        - OauthSecurityClient:
            - read
components:
  schemas:
    PersonInformationReportResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            type: object
            properties:
              reportName:
                type: string
                description: Report Name
              registration:
                $ref: '#/components/schemas/Registration'
              localization:
                $ref: '#/components/schemas/Localization'
              negativeData:
                $ref: '#/components/schemas/NegativeData'
              score:
                $ref: '#/components/schemas/Score'
              scores:
                $ref: '#/components/schemas/Scores'
              scoresFraud:
                $ref: '#/components/schemas/ScoresFraud'
              negativeFlag:
                $ref: '#/components/schemas/NegativeFlag'
              spcNegativeFlag:
                $ref: '#/components/schemas/SpcNegativeFlag'
              negativeSummary:
                $ref: '#/components/schemas/NegativeSummary'
              facts:
                $ref: '#/components/schemas/Facts'
              paymentsHistory:
                $ref: '#/components/schemas/PaymentsHistory'
              partner:
                $ref: '#/components/schemas/Partnerships'
              attributes:
                $ref: '#/components/schemas/Attributes'
              death:
                $ref: '#/components/schemas/DeathReport'
              creditLimitRecommendation:
                $ref: '#/components/schemas/CreditLimitRecommendationReport'
              attributesResponse:
                $ref: '#/components/schemas/AttributesResponse'
              deathAlert:
                $ref: '#/components/schemas/DeathAlert'
              zoom:
                $ref: '#/components/schemas/Zoom'
              checkFilings:
                $ref: '#/components/schemas/CheckFilings'
              checkFilingsHistorical:
                $ref: '#/components/schemas/CheckFilingsHistorical'
              score360:
                $ref: '#/components/schemas/Score360Report'
              income360:
                $ref: '#/components/schemas/Income360Report'


        optionalFeatures:
          type: object
          properties:
            registration:
              $ref: '#/components/schemas/Registration'
            localization:
              $ref: '#/components/schemas/Localization'
            negativeData:
              $ref: '#/components/schemas/NegativeData'
            score:
              $ref: '#/components/schemas/Score'
            scores:
              $ref: '#/components/schemas/Scores'
            scoresFraud:
              $ref: '#/components/schemas/ScoresFraud'
            negativeFlag:
              $ref: '#/components/schemas/NegativeFlag'
            spcNegativeFlag:
              $ref: '#/components/schemas/SpcNegativeFlag'
            negativeSummary:
              $ref: '#/components/schemas/NegativeSummary'
            facts:
              $ref: '#/components/schemas/Facts'
            paymentshistory:
              $ref: '#/components/schemas/PaymentsHistory'
            partner:
              $ref: '#/components/schemas/Partnerships'
            attributes:
              $ref: '#/components/schemas/Attributes'
            death:
              $ref: '#/components/schemas/DeathReport'
            creditLimitRecommendation:
              $ref: '#/components/schemas/CreditLimitRecommendationReport'
            deathAlert:
              $ref: '#/components/schemas/DeathAlert'
            zoom:
              $ref: '#/components/schemas/Zoom'
            checkFilings:
              $ref: '#/components/schemas/CheckFilings'
            checkFilingsHistorical:
              $ref: '#/components/schemas/CheckFilingsHistorical'
            score360:
              $ref: '#/components/schemas/Score360Report'
            income360:
              $ref: '#/components/schemas/Income360Report'


    AnalyzedCriteriaReport:
