    IncomeGraph:
      type: object
      required: [ centerNodeId, nodes, edges ]
      properties:
        centerNodeId:
          type: string
          description: ID do nó central (também presente em nodes[].id)
        nodes:
          type: array
          description: Lista de todos os nós; o nó central também aparece aqui.
          items:
            $ref: '#/components/schemas/IncomeNode'
        edges:
          type: array
          description: Lista de todas as arestas do grafo.
          items:
            $ref: '#/components/schemas/IncomeEdge'

    IncomeNode:
      type: object
      required: [ id, relationCategory, proximity ]
      properties:
        id:
          type: string
          description: Identificador do nó (nodeId persistido no DynamoDB).
        name:
          type: string
          description: Nome exibido.
        document:
          type: string
          description: Documento/ndoc do nó.
        relationCategory:
          $ref: '#/components/schemas/IncomeRelationCategory'
        proximity:
          type: integer
          minimum: 1
          maximum: 3
          description: Grau de proximidade ao nó central (1=mais próximo, 3=mais distante).

    IncomeEdge:
      type: object
      required: [ id, source, target, type ]
      properties:
        id:
          type: string
          description: Identificador estável da aresta (use a SK do DynamoDB, ex. EDGE#A#B).
        source:
          type: string
          description: ID do nó de origem (Node.id).
        target:
          type: string
          description: ID do nó de destino (Node.id).
        type:
          $ref: '#/components/schemas/IncomeEdgeType'
        proximity:
          type: integer
          minimum: 1
          maximum: 3
          description: Grau mínimo ao centro em um caminho que inclui esta aresta (para estilização).
        directed:
          type: boolean
          default: false
          description: Se true, aresta é dirigida (source → target). Caso contrário, trate como bidirecional no front.

    IncomeRelationCategory:
      type: string
      enum: [ HOUSEHOLD, RELATED ]
      description: Categoria do nó em relação ao nó central.

    IncomeEdgeType:
      type: string
      enum: [ HOUSEHOLD, RELATIONSHIP ]
      description: Tipo da relação entre nós.
    NDocRequest:
      type: object
      properties:
        ndoc:
