          type: string
          description: Proposal number
        document:
          type: string
          description: Document
        consumerName:
          type: string
          description: Consumer name
        transactionValue:
          type: number
          description: Transaction value
          example: 0.0
        creationDate:
          type: string
          format: date-time
          description: Creation date
        saleType:
          type: string
          description: Sale type
        saleTypeCode:
          type: integer
          format: int32
          description: Sale type code
          example: 0
        riskLevelCode:
          type: integer
          format: int32
          description: Risk level code
          example: 0
        recommendationType:
          type: string
          description: Recommendation type
        recommendationSaleType:
          type: string
          description: Recommendation sale type
        recommendedLimitValue:
