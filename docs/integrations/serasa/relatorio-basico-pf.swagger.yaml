        consumerName:
          type: string
          description: Name of the person consulted
        motherName:
          type: string
          description: Name of the mother´s person consulted
        consumerGender:
          type: string
          description: Gender of the person consulted
        maritalStatus:
          type: string
          description: Marital Status
        maritalStatusDescription:
          type: string
          description: Description of Marital Status
        birthSquareCode:
          type: string
          description: Birthplace Code
        birthSquareCity:
          type: string
          description: Name of City of Birth
        birthSquareState:
          type: string
          description: UF of the City of Birth
        birthDate:
          type: string
          format: date
          description: Full Birthday Date in American format (yyyy mm dd)
        deathDate:
          type: string
          format: date
        inclusionDeathRecord:
          type: string
          description: Date of inclusion of the death record
          format: date-time
        profession:
          type: string
          description: Profession of the person consulted
        professionCode:
          type: string
          description: Profession code of the person consulted
        jobDescription:
          type: string
          description: Job Description
        occupationCode:
          type: string
          description: Consulted person's occupation code
        occupation:
          type: string
          description: Consulted person's occupation description
        corporateCompanyName:
          type: string
          description: Full company name
        corporateCompanyDocumentNumber:
          type: string
          description: Company document number (CNPJ)
        educationLevelCode:
          type: string
          description: Education level code
        educationLevelDescription:
          type: string
          description: Description of education level
        dependentsNumber:
          type: string
          description: Number of Dependents
        statusRegistrationCode:
          type: string
          description: Registration status code of person at federal bureau
        statusRegistration:
          type: string
          description: Status of person at federal bureau
        oldStatusRegistrationCode:
          type: string
          description: Old status code of the company in Federal Revenue
        oldStatusRegistration:
          type: string
          description: Old status code description of the company in Federal Revenue
        statusDate:
          type: string
          description: Date status of the person consulted
          format: date
        socialName:
          type: string
          description: Social name of the individual being consulted
        consumerGenderDescription:
          type: string
          description: Description of the sex (gender) of the individual being consulted. Female (F) or Male (M) Return
        sourceInformationCode:
          type: string
          description: Code of origin of the individual information being consulted, e.g. SER
        sourceInformationDescription:
          type: string
          description: Description of the origin of the individual information being consulted, e.g. SERPRO (description of the SER code)
        address:
          $ref: '#/components/schemas/Address'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        phone:
          $ref: '#/components/schemas/Phone'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        error:
          $ref: '#/components/schemas/Error'
    Localization:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        phone:
          $ref: '#/components/schemas/Phone'
        error:
          $ref: '#/components/schemas/Error'
    DeathReport:
      type: object
      properties:
        consumerName:
          type: string
          description: Name of the person consulted
        motherName:
          type: string
          description: Name of the mother´s person consulted
        birthDate:
          type: string
          description: Birth date person consulted
          format: date
        deathDate:
          type: string
          description: Death date person consulted
          format: date
        inclusionDeathRecord:
          type: string
          description: Date of inclusion of the death record
          format: date-time
        error:
          $ref: '#/components/schemas/Error'
    Address:
      type: object
      properties:
        addressLine:
          type: string
          description: Address of person consulted
          example: Columbia street
        addressTypeCode:
          type: integer
          format: int32
          description: Address type code
          example: 0
        addressTypeDescription:
          type: string
          description: Description of the Address Type code
        addressNumber:
          type: string
          description: Address number
        district:
          type: string
          description: District of person consulted
        zipCode:
          type: string
          description: Zip Code of person consulted
          example: 12345-678
        country:
          type: string
          description: Country of person consulted
        city:
          type: string
          description: City of person consulted
        state:
          type: string
          description: State of person consulted
        addressComplement:
          type: string
          description: Address complement
        updateDate:
          type: string
          format: date
          description: Full date of the last information update in American format (yyyy mm dd) (full-date format = date-fullyear '-' date-month '-' date-mday)
    Phone:
      type: object
      properties:
        regionCode:
          type: integer
          format: int32
          description: Region code
          example: 0
        areaCode:
          type: integer
          format: int32
          description: Area code
          example: 0
        phoneNumber:
          type: integer
          format: int64
          description: Phone number
          example: 0
        phoneType:
          type: string
          description: Phone type
        phoneTypeCode:
          type: integer
          format: int32
          description: Phone type code
          example: 0
        updateDate:
          type: string
          format: date
          description: Full date of the last information update in American format (yyyy mm dd) (full-date format = date-fullyear '-' date-month '-' date-mday)
    Email:
      type: object
      properties:
        emailDescription:
          type: string
          description: Description of the full e-mail address of the individual consulted
        updateDate:
          type: string
          format: date
          description: Full date of the last information update in American format (yyyy mm dd) (full-date format = date-fullyear '-' date-month '-' date-mday)
    NegativeData:
      type: object
      properties:
        pefin:
          $ref: '#/components/schemas/Pefin'
        refin:
          $ref: '#/components/schemas/Refin'
        notary:
          $ref: '#/components/schemas/Notary'
        check:
          $ref: '#/components/schemas/Check'
        spcNegative:
          $ref: '#/components/schemas/SpcNegative'
        collectionRecords:
          $ref: '#/components/schemas/CollectionRecords'
        checkFilings:
          $ref: '#/components/schemas/CheckFilings'
        checkFilingsHistorical:
          $ref: '#/components/schemas/CheckFilingsHistorical'
    Pefin:
      type: object
      properties:
        pefinResponse:
          $ref: '#/components/schemas/PefinResponse'
        summary:
          $ref: '#/components/schemas/Summary'
        error:
          $ref: '#/components/schemas/Error'
    Refin:
      type: object
      properties:
        refinResponse:
          $ref: '#/components/schemas/RefinResponse'
        summary:
          $ref: '#/components/schemas/Summary'
        error:
          $ref: '#/components/schemas/Error'
    Notary:
      type: object
      properties:
        notaryResponse:
          $ref: '#/components/schemas/NotaryResponse'
        summary:
          $ref: '#/components/schemas/Summary'
        error:
          $ref: '#/components/schemas/Error'
    Check:
      type: object
      properties:
        checkResponse:
          $ref: '#/components/schemas/CheckResponse'
        summary:
          $ref: '#/components/schemas/SummaryCheck'
        error:
          $ref: '#/components/schemas/Error'
    SpcNegative:
      type: object
      properties:
        spcNegativeResponse:
          $ref: '#/components/schemas/SpcNegativeResponse'
        summary:
          $ref: '#/components/schemas/Summary'
        error:
          $ref: '#/components/schemas/Error'
    CollectionRecords:
      type: object
      properties:
        collectionRecordsResponse:
          $ref: '#/components/schemas/CollectionRecordsResponse'
        summary:
          $ref: '#/components/schemas/Summary'
        error:
          $ref: '#/components/schemas/Error'

    # ------------------ Resposta unificada ------------------
    GraphReportResponse:
      type: object
      required: [ graph ]
      properties:
        graph:
          $ref: '#/components/schemas/Graph'
    Graph:
      type: object
      required: [ centerNodeId, nodes, edges ]
      properties:
        centerNodeId:
          type: string
          description: ID do nó central (também presente em nodes[].id)
        nodes:
          type: array
          description: Lista de todos os nós; o nó central também aparece aqui.
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          description: Lista de todas as arestas do grafo.
          items:
            $ref: '#/components/schemas/Edge'
      # Nó unificado (Renda + Score no próprio modelo)
    Node:
      type: object
      required: [ id, relationCategory, proximity ]
      properties:
        # Base
        id:
          type: string
          description: Identificador do nó (nodeId persistido no DynamoDB).
        name:
          type: string
          description: Nome exibido.
        document:
          type: string
          description: Documento/ndoc do nó.
        relationCategory:
          $ref: '#/components/schemas/RelationCategory'
        proximity:
          type: integer
          minimum: 1
          maximum: 3
          description: Grau de proximidade ao nó central (1=mais próximo, 3=mais distante).
      # Aresta (sem alterações conceituais)
    Edge:
      type: object
      required: [ id, source, target, type ]
      properties:
        id:
          type: string
          description: Identificador estável da aresta (use a SK do DynamoDB, ex. EDGE#A#B).
        source:
          type: string
          description: ID do nó de origem (Node.id).
        target:
          type: string
          description: ID do nó de destino (Node.id).
        type:
          $ref: '#/components/schemas/EdgeType'
        proximity:
          type: integer
          minimum: 1
          maximum: 3
          description: Grau mínimo ao centro em um caminho que inclui esta aresta (para estilização).
        directed:
          type: boolean
          default: false
          description: Se true, aresta é dirigida (source → target). Caso contrário, trate como bidirecional no front.
    RelationCategory:
      type: string
      enum: [ HOUSEHOLD, RELATED ]
      description: Categoria do nó em relação ao nó central.
    EdgeType:
      type: string
      enum: [ HOUSEHOLD, RELATIONSHIP ]
      description: Tipo da relação entre nós.


    Score360Report:
      type: object
      properties:
        scoreResponse:
          $ref: '#/components/schemas/ScoreResponse'
        graphResponse:
          $ref: "#/components/schemas/GraphReportResponse"

    Score:
      type: object
      properties:
        score:
          type: integer
          description: Value of the score
          example: 0
        scoreModel:
          type: string
          description: Model used to get the score. Examples [HSPN], [HSPO]
        range:
          type: string
          description: Name of the ranges of each interval for rating the score
        defaultRate:
          type: string
          description: Probability non-payments
        codeMessage:
          type: integer
          description: Code score message
          example: 0
        message:
          type: string
          description: Score message
        error:
          $ref: '#/components/schemas/Error'
      description: General data about score consulted document
    Scores:
      type: object
      properties:
        scoreResponse:
          $ref: '#/components/schemas/ScoreResponse'

    Features:
      type: object
      description: >
        Objeto consolidado de atributos do score. Os campos são CONDICIONAIS ao
        modelo/feature efetivamente consultado — um retorno traz apenas os campos
        do(s) modelo(s) correspondente(s):

        - trend, control, profile → Score Mais 5.0 (HSM5)

        - agro → elegibilidade Agro (HRP5)

        - scoreRelatedAverage, scoreHouseholdAverage, householdQty, relatedQty → Score 360

        - income, paymentCapacity, incomeCommitment, incomeSource, *Segment, leverage* → features de Renda
      properties:
        flag_apostador:
          type: integer
        frequenciaapostas:
          type: integer
        tm_1m:
          type: integer
        tm_3m:
          type: integer
        tm_6m:
          type: integer
        ccpa_valor:
          type: integer
        ccpa_pp:
          type: integer
        income:
          type: string
        paymentCapacity:
          type: string
        incomeCommitment:
          type: string
        incomeSource:
          type: array
          items:
            $ref: '#/components/schemas/IncomeSource'
        generalPrincipality:
          type: string
        cardPrincipality:
          type: string
        privateSegment:
          type: string
        publicSegment:
          type: string
        fintechSegment:
          type: string
        cooperativeSegment:
          type: string
        retailSegment:
          type: string
        currentLeverage:
          type: number
        leverageUpTo1Y:
          type: number
        leverageUpTo3Y:
          type: number
        leverageUpTo5Y:
          type: number
        leverageUpTo15Y:
          type: number
        scoreRelatedAverage:
          type: integer
          format: int32
        scoreHouseholdAverage:
          type: integer
          format: int32
        householdQty:
          type: integer
          format: int32
        relatedQty:
          type: integer
          format: int32
        trend:
          type: integer
          format: int32
          description: "1..18 (HSM5 e HAM5)"
          minimum: 1
          maximum: 18
        control:
          type: integer
          format: int32
          description: "HSM5: 1..5"
          minimum: 1
          maximum: 5
        profile:
          type: integer
          format: int32
          description: "HSM5: 1..12"
          minimum: 1
          maximum: 12
        agro:
          type: integer
          format: int32
          description: "HRP5: 0 (não elegível) ou 1 (elegível)"
          enum: [ 0, 1 ]
        hhd8Seg1:
          type: string
        hhd8Seg2:
          type: string
        hhd8Seg3:
          type: string
        hhd8Seg4:
          type: string
    IncomeSource:
      type: object
      properties:
        sourceCode:
          type: string
        sourceDescription:
          type: string


    ScoreResponse:
      type: array
      items:
        type: object
        properties:
          score:
            type: integer
            description: Value of the score
            example: 0
          scoreModel:
            type: string
            description: Model used to get the score. Examples [HSPN], [HSPO]
          range:
            type: string
            description: Name of the ranges of each interval for rating the score
          defaultRate:
            type: string
            description: Probability non-payments
          codeMessage:
            type: integer
            description: Code score message
            example: 0
          message:
            type: string
            description: Score message
          features:
            $ref: '#/components/schemas/Features'
          error:
            $ref: '#/components/schemas/Error'

    ScoresFraud:
      type: object
      properties:
        scoresFraudResponse:
          $ref: '#/components/schemas/ScoresFraudResponse'
    ScoresFraudResponse:
      type: array
      items:
        type: object
        properties:
          scoreModel:
            type: string
            description: Model used to get score
          score:
            type: integer
            description: Value of the score
            example: 0
          recommendationRisk:
            type: string
            description: Recommendation based on score value
          message:
            type: string
            description: Score message
          error:
            $ref: '#/components/schemas/Error'
    NegativeFlag:
      type: object
      properties:
        hasNegative:
          type: boolean
          description: If the negative flag is true the totalAmount and totalValue will be shown
        totalAmount:
          type: integer
          description: Total quantity (count) of all negatives
          example: 0
        totalValue:
          type: number
          description: Total value of all negatives
          example: 0 0
      description: General data about negative flag consulted document
    SpcNegativeFlag:
      type: object
      properties:
        hasNegative:
          type: boolean
          description: Negative flag indicative
      description: General data about spc negative flag consulted document
