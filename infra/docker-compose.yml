name: frotaone

services:
  # MongoDB em replica set de um nó — necessário para as transações
  # multi-documento usadas nos fluxos financeiros.
  mongo:
    image: mongo:7
    container_name: frotaone-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/etc/mongo/keyfile']
    environment:
      MONGO_INITDB_ROOT_USERNAME: frotaone
      MONGO_INITDB_ROOT_PASSWORD: frotaone
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./mongo/keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 10

  # Inicializa o replica set uma única vez.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo -u frotaone -p frotaone --authenticationDatabase admin --quiet --eval '
          try {
            rs.status();
            print("replica set já inicializado");
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
            print("replica set inicializado");
          }
        '

  # Armazenamento de objetos compatível com S3 (fotos, documentos, notas).
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: frotaone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: frotaone
      MINIO_ROOT_PASSWORD: frotaone123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 frotaone frotaone123 &&
        mc mb --ignore-existing local/frotaone &&
        echo "bucket pronto"

volumes:
  mongo-data:
  minio-data:
