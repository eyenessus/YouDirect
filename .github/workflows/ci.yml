name: CI

# Nenhum deploy sem verificação: o Heroku publica a `main` automaticamente,
# então esta checagem deve ser obrigatória na proteção da branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências (lockfile)
        run: npm ci
      - name: Cache do binário do MongoDB em memória
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Build dos contratos
        run: npm run build -w @yudirect/contracts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes (contracts, API, web)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high
